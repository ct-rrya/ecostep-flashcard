services:
  - type: web
    name: ecostep-defense-flashcards
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ecostep-flashcards
      - key: SESSION_SECRET
        generateValue: true
